ner('click', () => { const follow = button.querySelector('.follow'); const active = follow.textContent === '+'; follow.textContent = active ? '✓' : '+'; }); }); document.querySelectorAll('[data-action="comment"]').forEach(button => { button.addEventListener('click', () => { alert('ستتوفر التعليقات بعد ربط قاعدة البيانات.'); }); }); document.querySelectorAll('[data-action="share"]').forEach(button => { button.addEventListener('click', async () => { if (navigator.share) { try { await navigator.share({ title: 'LibyaLY', text: 'اكتشف LibyaLY!' }); } catch (e) {} } else { alert('ستتوفر المشاركة الكاملة لاحقًا.'); } }); }); document.querySelectorAll('[data-tab]').forEach(button => { button.addEventListener('click', () => { const tab = button.dataset.tab; if (tab === 'upload') { alert('سنضيف رفع الفيديوهات في مرحلة لاحقة.'); return; } if (tab !== 'home') { alert('سيتم بناء هذه الصفحة في مرحلة لاحقة.'); return; } document.querySelectorAll('[data-tab]').forEach(item => { item.classList.toggle('active', item.dataset.tab === 'home'); }); document.getElementById('feed').scrollTo({ top: 0, behavior: 'smooth' }); }); }); </script> </body> </html>
